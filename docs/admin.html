<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>관리자 — 칩 게임</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="shell">
  <div class="topbar">
    <div class="brand">칩 게임 · 관리자</div>
    <div class="who"><a href="#" id="admin-logout" style="display:none;">로그아웃</a></div>
  </div>

  <div id="login-panel" class="panel">
    <div class="panel-title">관리자 로그인</div>
    <div id="login-msg" class="msg" style="display:none;"></div>
    <form id="admin-login-form">
      <label>관리자 비밀번호</label>
      <input type="password" name="password" required />
      <button type="submit" style="margin-top:10px;">로그인</button>
    </form>
  </div>

  <div id="admin-body" style="display:none;">

    <div class="panel">
      <div class="panel-title">팀 만들기</div>
      <form id="create-team-form" class="spread">
        <input type="text" name="name" placeholder="팀 이름" required />
        <button type="submit">추가</button>
      </form>
      <div id="team-list" style="margin-top:10px;"></div>
    </div>

    <div class="panel">
      <div class="panel-title">러너 만들기</div>
      <form id="create-runner-form">
        <div class="spread">
          <div><label>로그인 아이디</label><input type="text" name="id" required /></div>
          <div><label>비밀번호</label><input type="text" name="password" required /></div>
        </div>
        <div class="spread">
          <div><label>표시 이름</label><input type="text" name="displayName" /></div>
          <div><label>소속 팀</label><select name="teamId" id="team-select"></select></div>
        </div>
        <label>시작 칩 (총합 30개 이하) — 현재 합계: <span id="chip-sum" class="mono">0</span> / 30</label>
        <div class="spread">
          <div><span class="chip-swatch chip-red"></span><input type="number" name="chip_red" min="0" value="0" /></div>
          <div><span class="chip-swatch chip-blue"></span><input type="number" name="chip_blue" min="0" value="0" /></div>
          <div><span class="chip-swatch chip-green"></span><input type="number" name="chip_green" min="0" value="0" /></div>
          <div><span class="chip-swatch chip-yellow"></span><input type="number" name="chip_yellow" min="0" value="0" /></div>
          <div><span class="chip-swatch chip-white"></span><input type="number" name="chip_white" min="0" value="0" /></div>
        </div>
        <button type="submit" style="margin-top:10px;">러너 생성</button>
      </form>
      <div id="create-runner-msg" class="msg" style="display:none;"></div>
    </div>

    <div class="panel">
      <div class="panel-title">칩 가치 직접 설정</div>
      <form id="set-value-form" class="spread">
        <select name="color" id="value-color-select"></select>
        <input type="number" name="value" placeholder="새 가치" required />
        <button type="submit">적용</button>
      </form>
    </div>

    <div class="panel">
      <div class="panel-title">현황판</div>
      <button id="refresh-overview" class="secondary">새로고침</button>
      <div id="overview" style="margin-top:12px;"></div>
    </div>

    <div class="panel">
      <div class="panel-title">전체 러너</div>
      <div id="runner-list"></div>
    </div>

  </div>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
